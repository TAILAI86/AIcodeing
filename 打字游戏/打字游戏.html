<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>打字风暴 · Typing Storm</title>
<style>
:root{
  --bg:#0b1020; --bg2:#121a33; --panel:#161f3d; --panel2:#1d2849;
  --line:#2a3760; --txt:#e8ecf8; --dim:#8fa0c8; --dim2:#61729b;
  --acc:#38e1c4; --acc2:#7aa2ff; --warn:#ffb454; --bad:#ff6b81; --good:#5ddc7a;
  --gold:#ffd166; --purple:#b07cff; --radius:14px; --radius2:20px;
  --shadow:0 10px 40px rgba(0,0,0,.45); --fs:16px;
  --font:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Noto Sans CJK SC",system-ui,sans-serif;
  --mono:"SF Mono",Menlo,Consolas,"Courier New",monospace;
}
html[data-theme="light"]{
  --bg:#eef2fb; --bg2:#e2e9f8; --panel:#ffffff; --panel2:#f4f7ff;
  --line:#cfd9f0; --txt:#182036; --dim:#5b6b90; --dim2:#8494b8;
  --shadow:0 8px 28px rgba(30,50,100,.13);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:
    radial-gradient(1100px 600px at 12% -8%,rgba(56,225,196,.10),transparent 60%),
    radial-gradient(900px 600px at 95% 8%,rgba(122,162,255,.12),transparent 60%),
    var(--bg);
  color:var(--txt); font-family:var(--font); font-size:var(--fs);
  overflow:hidden; transition:background .3s,color .3s;
}
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);
  background-size:44px 44px;
}
html[data-theme="light"] body::before{background-image:linear-gradient(rgba(20,40,90,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(20,40,90,.045) 1px,transparent 1px)}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:0;background:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}
::-webkit-scrollbar-thumb:hover{background:var(--dim2)}
.shake{animation:shake .28s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translate(-2px,0)}30%,70%{transform:translate(4px,0)}50%{transform:translate(-6px,0)}}
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}

/* ============ 顶栏 ============ */
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:12px 20px;border-bottom:1px solid var(--line);
  background:color-mix(in srgb,var(--panel) 72%,transparent);backdrop-filter:blur(14px);flex:0 0 auto;
}
.brand{display:flex;align-items:baseline;gap:9px;font-weight:800;font-size:19px;letter-spacing:.4px;white-space:nowrap}
.brand .sub{font-size:11px;font-weight:600;color:var(--dim2);letter-spacing:2.4px;text-transform:uppercase}
.chips{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;
  background:var(--panel2);border:1px solid var(--line);font-size:12.5px;font-weight:600;
  color:var(--dim);white-space:nowrap;font-variant-numeric:tabular-nums;
}
.chip b{color:var(--txt);font-weight:800}
.chip.gold b{color:var(--gold)} .chip.acc b{color:var(--acc)} .chip.warn b{color:var(--warn)}
.icon-btn{
  width:34px;height:34px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);
  display:grid;place-items:center;font-size:15px;transition:.18s;flex:0 0 auto;
}
.icon-btn:hover{border-color:var(--acc);transform:translateY(-1px)}

/* ============ 布局 ============ */
main{flex:1;min-height:0;display:flex;overflow:hidden}
.view{display:none;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden}
.view.on{display:flex}
/* 关键：.col-main 也在 CSS 中声明了 display:flex，且权重与 .view 相同，
   若仅靠 .view{display:none} 会被后声明的 .col-main 覆盖，导致未激活视图仍然显示。
   故此处用 :not(.on) + !important 强制隐藏非激活视图。 */
.view:not(.on){display:none !important}
.col-main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.side{
  width:308px;flex:0 0 308px;border-left:1px solid var(--line);overflow-y:auto;
  padding:16px;display:flex;flex-direction:column;gap:14px;background:color-mix(in srgb,var(--panel) 42%,transparent);
}
.pad{padding:20px 24px}

/* ============ 卡片 ============ */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.card h3{margin:0 0 12px;font-size:13px;font-weight:700;color:var(--dim);letter-spacing:1.4px;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
.card h3 em{font-style:normal;color:var(--acc);font-size:12px;letter-spacing:0}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px}
.mode{
  position:relative;text-align:left;padding:16px;border-radius:var(--radius);
  background:var(--panel);border:1px solid var(--line);transition:.2s;overflow:hidden;
}
.mode:hover{border-color:var(--acc);transform:translateY(-3px);box-shadow:var(--shadow)}
.mode.on{border-color:var(--acc);background:linear-gradient(150deg,color-mix(in srgb,var(--acc) 15%,var(--panel)),var(--panel))}
.mode .ico{font-size:26px;display:block;margin-bottom:7px}
.mode .nm{font-weight:800;font-size:15.5px;margin-bottom:4px}
.mode .ds{font-size:12px;color:var(--dim);line-height:1.55}
.mode .best{position:absolute;top:12px;right:13px;font-size:10.5px;color:var(--dim2);font-weight:700}
.mode.locked{opacity:.42;pointer-events:none}
.mode.locked::after{content:"🔒";position:absolute;inset:0;display:grid;place-items:center;font-size:30px;background:rgba(0,0,0,.28)}

.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{padding:6px 13px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--dim);transition:.15s;white-space:nowrap}
.seg button.on{background:var(--acc);color:#04211c}
html[data-theme="light"] .seg button.on{color:#04211c}
.seg button:hover:not(.on){color:var(--txt)}
.row{display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.row .lb{font-size:12px;font-weight:700;color:var(--dim2);letter-spacing:.8px;margin-right:-8px}
.btn{
  padding:11px 22px;border-radius:12px;font-weight:800;font-size:14px;transition:.18s;
  background:var(--panel2);border:1px solid var(--line);
}
.btn:hover{border-color:var(--acc);transform:translateY(-1px)}
.btn.pri{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#04211c;border-color:transparent;box-shadow:0 6px 22px color-mix(in srgb,var(--acc) 32%,transparent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:7px 13px;font-size:12.5px;border-radius:9px}
.btn.gold{background:linear-gradient(135deg,var(--gold),#ff9f45);color:#3a2400;border-color:transparent}
.btn:disabled{opacity:.4;pointer-events:none}
.daily{
  display:flex;align-items:center;gap:14px;padding:15px 17px;border-radius:var(--radius);
  background:linear-gradient(120deg,color-mix(in srgb,var(--purple) 20%,var(--panel)),var(--panel));
  border:1px solid color-mix(in srgb,var(--purple) 40%,var(--line));
}
.daily .ic{font-size:30px}
.daily .tt{font-weight:800;font-size:14.5px}
.daily .ds{font-size:11.5px;color:var(--dim);margin-top:2px;line-height:1.5}

/* ============ 玩法页 HUD ============ */
.hud{display:flex;align-items:center;gap:9px;padding:12px 22px;border-bottom:1px solid var(--line);flex-wrap:wrap;flex:0 0 auto}
.metric{display:flex;flex-direction:column;line-height:1.15;min-width:74px}
.metric .v{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.4px}
.metric .k{font-size:10px;color:var(--dim2);font-weight:700;letter-spacing:1.1px;text-transform:uppercase}
.metric.big .v{font-size:27px;color:var(--acc)}
.metric.warn .v{color:var(--warn)} .metric.bad .v{color:var(--bad)}
.hud .sp{flex:1}
.hud-r{display:flex;gap:8px;align-items:center}
.lives{display:flex;gap:4px}
.lives i{width:15px;height:15px;border-radius:50%;background:var(--bad);display:block;transition:.25s;font-style:normal}
.lives i.off{background:var(--line);transform:scale(.72)}

.play-area{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;position:relative}
.combo-wrap{
  position:absolute;top:14px;right:22px;z-index:6;text-align:right;pointer-events:none;
  transition:opacity .3s;
}
.combo-num{
  font-size:52px;font-weight:900;line-height:.92;font-variant-numeric:tabular-nums;letter-spacing:-2px;
  background:linear-gradient(180deg,#fff,var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 18px color-mix(in srgb,var(--acc) 45%,transparent));
}
.combo-num.pop{animation:cpop .28s ease-out}
.combo-wrap.hot .combo-num{
  filter:drop-shadow(0 0 26px color-mix(in srgb,var(--warn) 70%,transparent));
  background:linear-gradient(180deg,#fff,var(--warn));
}
.combo-wrap.hot .combo-lb{color:var(--warn)}
.combo-wrap.blaze .combo-num{
  filter:drop-shadow(0 0 34px color-mix(in srgb,var(--bad) 80%,transparent));
  background:linear-gradient(180deg,#fff,var(--bad));
  animation:blaze .5s ease-in-out infinite alternate;
}
.combo-wrap.blaze .combo-lb{color:var(--bad)}
@keyframes blaze{from{transform:scale(1)}to{transform:scale(1.08)}}
@keyframes cpop{0%{transform:scale(1)}42%{transform:scale(1.32)}100%{transform:scale(1)}}
.combo-lb{font-size:10.5px;font-weight:800;letter-spacing:3.4px;color:var(--dim2);text-transform:uppercase}
.combo-flame{position:absolute;inset:-14px -8px 0 auto;width:120px;height:120px;pointer-events:none;opacity:0;transition:opacity .4s}
.combo-flame.on{opacity:.95}
.flow-wrap{flex:1;min-height:0;overflow:hidden;position:relative;padding:26px 26px 64px}
.flow{
  position:absolute;left:0;right:0;top:34%;
  display:flex;flex-direction:column;gap:12px;align-items:flex-start;
  transition:transform .22s cubic-bezier(.4,0,.2,1);padding-left:26px;
  max-height:calc(100% - 20px);overflow:hidden;
}
.unit{display:flex;flex-direction:column;gap:5px;opacity:.32;transition:opacity .2s,transform .2s;transform-origin:left center}
.unit.cur{opacity:1;transform:scale(1.045)}
.unit.past{opacity:.16}
.cn-row{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-end}
.cn-char{
  font-size:38px;font-weight:700;line-height:1.16;padding:2px 4px;border-radius:9px;
  color:var(--dim);transition:.16s;font-family:var(--font);
}
.cn-char.g{color:var(--good);text-shadow:0 0 16px color-mix(in srgb,var(--good) 45%,transparent)}
.cn-char.hit{color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,transparent)}
.cn-char.miss{color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,transparent);animation:shk .2s}
.py-row{display:flex;gap:11px;flex-wrap:wrap}
.py-syl{display:flex;gap:1px;font-family:var(--mono);font-size:13.5px;color:var(--dim2);letter-spacing:.6px}
.py-syl b{font-weight:600;transition:.12s;display:inline-block;min-width:.62em;text-align:center}
.py-syl b.c{color:var(--acc);text-shadow:0 0 12px color-mix(in srgb,var(--acc) 50%,transparent)}
.py-syl b.cur{color:var(--txt)}
.py-syl b.w{color:var(--bad)}
.en-row{display:flex;gap:1px;font-family:var(--mono);font-size:34px;font-weight:600;letter-spacing:1.5px}
.en-row b{font-weight:600;transition:.12s;color:var(--dim)}
.en-row b.c{color:var(--acc);text-shadow:0 0 14px color-mix(in srgb,var(--acc) 42%,transparent)}
.en-row b.w{color:var(--bad);text-shadow:0 0 14px color-mix(in srgb,var(--bad) 42%,transparent)}
.en-row b.cur{color:var(--txt)}
.unit .ahead{font-size:12px;color:var(--dim2);font-family:var(--mono);letter-spacing:2px}
.hint-line{position:absolute;left:26px;bottom:14px;font-size:12.5px;color:var(--dim2);z-index:5;display:flex;gap:16px;flex-wrap:wrap;pointer-events:none}
kbd{
  font-family:var(--mono);font-size:11px;padding:2px 6px;border-radius:5px;background:var(--panel2);
  border:1px solid var(--line);border-bottom-width:2px;color:var(--dim);font-weight:600;
}
.danger-edge{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:8;box-shadow:inset 0 0 90px 14px rgba(255,107,129,.55)}
.danger-edge.hit{animation:de .38s ease-out}
@keyframes de{0%{opacity:1}100%{opacity:0}}

/* ============ 结算 ============ */
.result-wrap{max-width:760px;margin:0 auto;padding:34px 24px;text-align:center}
.res-title{font-size:40px;font-weight:900;margin:0 0 6px;letter-spacing:-1px}
.res-sub{color:var(--dim);font-size:14px;margin-bottom:26px}
.res-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:12px;margin-bottom:22px}
.res-cell{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 12px}
.res-cell .v{font-size:27px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.6px}
.res-cell .k{font-size:10.5px;color:var(--dim2);font-weight:700;letter-spacing:1.1px;margin-top:3px;text-transform:uppercase}
.res-cell.hero .v{color:var(--acc)} .res-cell.warn .v{color:var(--warn)} .res-cell.bad .v{color:var(--bad)}
.rewards{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:24px}
.rw{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:13px;font-weight:700}
.rw.gold{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 40%,var(--line))}
.rw.acc{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 40%,var(--line))}
.rw.purple{color:var(--purple);border-color:color-mix(in srgb,var(--purple) 45%,var(--line))}
.newrec{display:inline-block;padding:6px 15px;border-radius:999px;background:linear-gradient(135deg,var(--gold),#ff9f45);color:#3a2400;font-size:12px;font-weight:900;letter-spacing:1px;margin-bottom:18px;animation:cpop .5s}

/* ============ 底部导航 ============ */
.tabbar{
  flex:0 0 auto;display:flex;gap:4px;padding:8px 16px;border-top:1px solid var(--line);
  background:color-mix(in srgb,var(--panel) 78%,transparent);backdrop-filter:blur(14px);overflow-x:auto;
}
.tabbar button{padding:8px 17px;border-radius:10px;font-size:13.5px;font-weight:700;color:var(--dim);transition:.16s;white-space:nowrap}
.tabbar button.on{background:var(--acc);color:#04211c}
.tabbar button:hover:not(.on){color:var(--txt);background:var(--panel2)}
.tabbar .sp{flex:1}

/* ============ 技能树 ============ */
.tree{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.branch{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius2);padding:16px}
.branch>h4{margin:0 0 3px;font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px}
.branch>p{margin:0 0 14px;font-size:11.5px;color:var(--dim2);line-height:1.5}
.skill{
  display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:12px;margin-bottom:8px;
  background:var(--panel2);border:1px solid var(--line);transition:.18s;
}
.skill.maxed{border-color:color-mix(in srgb,var(--gold) 45%,var(--line))}
.skill.locked{opacity:.45}
.skill .ic{font-size:20px;width:26px;text-align:center;flex:0 0 auto}
.skill .tx{flex:1;min-width:0}
.skill .nm{font-weight:800;font-size:13.5px;display:flex;align-items:center;gap:7px}
.skill .ds{font-size:11px;color:var(--dim);margin-top:2px;line-height:1.45}
.pips{display:flex;gap:3px;margin-top:5px}
.pips i{width:15px;height:4px;border-radius:2px;background:var(--line);display:block}
.pips i.f{background:var(--acc)}
.skill .lv{font-size:11px;font-weight:800;color:var(--dim2);flex:0 0 auto;font-variant-numeric:tabular-nums}

/* ============ 成就 ============ */
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:11px}
.ach{
  padding:14px;border-radius:var(--radius);background:var(--panel);border:1px solid var(--line);
  text-align:center;transition:.2s;position:relative;
}
.ach.got{background:linear-gradient(160deg,color-mix(in srgb,var(--gold) 16%,var(--panel)),var(--panel));border-color:color-mix(in srgb,var(--gold) 42%,var(--line))}
.ach .ic{font-size:27px;filter:grayscale(1);opacity:.45}
.ach.got .ic{filter:none;opacity:1}
.ach .nm{font-weight:800;font-size:12.5px;margin-top:6px}
.ach .ds{font-size:10.5px;color:var(--dim);margin-top:3px;line-height:1.45}

/* ============ 统计 / 图表 ============ */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(126px,1fr));gap:11px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.kpi .v{font-size:23px;font-weight:900;font-variant-numeric:tabular-nums}
.kpi .k{font-size:10.5px;color:var(--dim2);font-weight:700;letter-spacing:.9px;margin-top:2px;text-transform:uppercase}
.chart-box{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.chart-box h3{margin:0 0 10px;font-size:12px;color:var(--dim);letter-spacing:1.3px;text-transform:uppercase;font-weight:700}
canvas{width:100%;display:block;border-radius:8px}
.weak-list{display:flex;flex-direction:column;gap:7px}
.weak{display:flex;align-items:center;gap:10px;font-size:12.5px}
.weak .k{font-family:var(--mono);font-size:15px;font-weight:700;width:26px;text-align:center;
  background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:2px 0}
.weak .bar{flex:1;height:7px;border-radius:4px;background:var(--line);overflow:hidden}
.weak .bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--acc),var(--bad))}
.weak .ms{color:var(--dim2);font-variant-numeric:tabular-nums;width:56px;text-align:right;font-size:11.5px}

/* ============ 弹窗 ============ */
.mask{
  position:fixed;inset:0;background:rgba(4,8,20,.76);backdrop-filter:blur(7px);z-index:60;
  display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .2s;
}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius2);
  width:100%;max-width:480px;max-height:88vh;overflow-y:auto;padding:24px;box-shadow:var(--shadow);
  animation:rise .24s cubic-bezier(.2,.9,.3,1);
}
@keyframes rise{from{transform:translateY(16px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.modal h3{margin:0 0 16px;font-size:17px;font-weight:800}
.modal .set-row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.modal .set-row:last-child{border-bottom:0}
.modal .set-row .t{font-size:13.5px;font-weight:700}
.modal .set-row .d{font-size:11.5px;color:var(--dim2);margin-top:3px;line-height:1.45}
.switch{width:44px;height:25px;border-radius:999px;background:var(--line);position:relative;transition:.2s;flex:0 0 auto}
.switch.on{background:var(--acc)}
.switch i{position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:.2s}
.switch.on i{left:22px}
.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.skin{padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);text-align:center;transition:.18s;position:relative}
.skin:hover{border-color:var(--acc)}
.skin.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.skin .sw{height:26px;border-radius:8px;margin-bottom:6px}
.skin .nm{font-size:11.5px;font-weight:700}
.skin .pr{font-size:10.5px;color:var(--gold);margin-top:3px}
.skin .own{font-size:10.5px;color:var(--good);margin-top:3px}
.toast-wrap{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:9px;align-items:center;pointer-events:none}
.toast{
  padding:11px 20px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);
  font-size:13.5px;font-weight:700;box-shadow:var(--shadow);animation:tin .3s cubic-bezier(.2,.9,.3,1);
}
.toast.gold{border-color:color-mix(in srgb,var(--gold) 55%,var(--line));color:var(--gold)}
.toast.acc{border-color:color-mix(in srgb,var(--acc) 55%,var(--line));color:var(--acc)}

.float-txt{
  position:absolute;z-index:9;font-weight:900;font-size:17px;pointer-events:none;
  color:var(--acc);text-shadow:0 2px 12px rgba(0,0,0,.5);animation:ft 1s ease-out forwards;
}
@keyframes ft{0%{opacity:0;transform:translateY(0) scale(.8)}22%{opacity:1;transform:translateY(-14px) scale(1.08)}100%{opacity:0;transform:translateY(-58px) scale(1)}}
.particle{position:absolute;width:7px;height:7px;border-radius:2px;pointer-events:none;z-index:9;animation:pt .85s ease-out forwards}
@keyframes pt{0%{opacity:1;transform:translate(0,0) rotate(0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(.25)}}

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* ------------------------------------------------------------ 词库解析 */
function parsePairs(str){
  const out=[];
  for(const raw of str.split(";")){
    const seg=raw.trim(); if(!seg) continue;
    const i=seg.indexOf("|"); if(i<0) continue;
    const text=seg.slice(0,i), py=seg.slice(i+1);
    out.push({ text, syl:py.split(/\s+/).filter(Boolean) });
  }
  return out;
}
const POOLS = {};
function buildPools(){
  POOLS.cn = {};
  POOLS.en = {};
  POOLS["cn-easy"]=parsePairs(CN_BASIC);
  POOLS["cn-mid"] =parsePairs(CN_MID);
  POOLS["cn-hard"]=parsePairs(CN_HARD);
  POOLS["en-easy"]=EN_EASY.split(/\s+/).filter(Boolean).map(w=>({text:w,syl:[w]}));
  POOLS["en-mid"] =EN_MID.split(/\s+/).filter(Boolean).map(w=>({text:w,syl:[w]}));
  POOLS["en-hard"]=EN_HARD.split(/\s+/).filter(Boolean).map(w=>({text:w,syl:[w]}));
  POOLS["en-code"]=EN_CODE.split(";").map(s=>s.trim()).filter(Boolean).map(w=>({text:w,syl:[w]}));
}

const Audio2 = {
  ctx:null, master:null,
  init(){
    if(this.ctx) return;
    try{
      const AC = window.AudioContext||window.webkitAudioContext;
      if(!AC) return;
      this.ctx=new AC();
      this.master=this.ctx.createGain();
      this.master.gain.value=0.28;
      this.master.connect(this.ctx.destination);
    }catch(e){ this.ctx=null; }
  },
  tone(freq,dur,type,vol,slideTo){
    if(!STORE.settings.sound||!this.ctx) return;
    try{
      const t=this.ctx.currentTime;
      const o=this.ctx.createOscillator(), g=this.ctx.createGain();
      o.type=type||STORE.settings.tone||"sine";
      o.frequency.setValueAtTime(freq,t);
      if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30,slideTo),t+dur);
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(vol||0.22,t+0.008);
      g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.connect(g); g.connect(this.master);
      o.start(t); o.stop(t+dur+0.02);
    }catch(e){}
  },
  key(combo){ this.tone(520+Math.min(combo,60)*7,0.045,"sine",0.13); },
  err(){ this.tone(150,0.16,"sawtooth",0.2,90); },
  word(combo){ this.tone(700+Math.min(combo,40)*10,0.09,"triangle",0.2); },
  milestone(){ this.tone(880,0.1,"sine",0.24); setTimeout(()=>this.tone(1320,0.14,"sine",0.22),90); },
  finish(){ [523,659,784,1046].forEach((f,i)=>setTimeout(()=>this.tone(f,0.2,"triangle",0.2),i*110)); }
};

/* ------------------------------------------------------------ 游戏状态 */
const G = {
  on:false, mode:"sprint", diff:"normal", lang:"cn", daily:false,
  units:[], idx:0, ci:0, gi:0,          // gi = 当前拼音音节索引
  input:"",                              // 当前单元已输入的字符串
  combo:0, maxCombo:0, correct:0, wrong:0, score:0,
  words:0, lives:3, maxLives:3, shields:0, immuneUntil:0,
  cnChars:0, enChars:0,
  startTs:0, elapsed:0, limit:60, endTs:0,
  threat:0, threatRate:0, stage:0, stageNeed:8, stageDone:0,
  timer:null, rng:null, pool:"", pendingPool:"",
  wordScore:0, perfect:true, lastKeyTs:0, keyDelay:{}
};
const CONFIG = { mode:"sprint", diff:"normal", lang:"cn" };

/* --------------------------------------------------------- 词流生成器 */
function poolKey(){
  const sk=S().skills||{};
  let cnKey="cn-easy", enKey="en-easy";
  const hasErudite = (sk.erudite||0)>=1;
  const hasSavant  = (sk.savant||0)>=1;
  switch(CONFIG.diff){
    case "easy":   cnKey="cn-easy"; enKey="en-easy"; break;
    case "normal": cnKey=hasErudite?"cn-mid":"cn-easy";
                   enKey=hasErudite?"en-mid":"en-easy"; break;
    case "hard":   cnKey=hasSavant?"cn-hard":(hasErudite?"cn-mid":"cn-easy");
                   enKey=hasSavant?"en-hard":(hasErudite?"en-mid":"en-easy"); break;
    case "night":  cnKey=hasSavant?"cn-hard":"cn-mid";
                   enKey=hasSavant?"en-code":"en-hard"; break;
  }
  return {cn:cnKey,en:enKey};
}
function makeUnit(rng){
  const pk=poolKey();
  const mix = CONFIG.lang==="mix";
  let useCn = CONFIG.lang==="cn" ? true : CONFIG.lang==="en" ? false : (rng()<0.5);
  if(mix && !(S().skills||{}).polyglot) useCn=true;
  const list = useCn ? POOLS[pk.cn] : POOLS[pk.en];
  const item = list[Math.floor(rng()*list.length)];
  const syl = item.syl.slice();
  return {
    lang: useCn?"cn":"en",
    text: item.text,
    syl,
    input: syl.join(""),
    typed: ""
  };
}
function fillUnits(n){
  if(!G.rng) G.rng=mulberry32((Date.now()^hashStr(String(Math.random())))|0);
  for(let i=0;i<n;i++) G.units.push(makeUnit(G.rng));
}
function nextUnit(){
  if(!G.rng) G.rng=mulberry32((Date.now()^hashStr(String(Math.random())))|0);
  G.units.push(makeUnit(G.rng));
  if(G.units.length>20){
    const d=G.units.length-20;
    G.units.splice(0,d);
    G.idx-=d;
  }
}

/* -------------------------------------------------------------- 开始游戏 */
function startGame(dailyCfg){
  Audio2.init();
  const s=S();
  if(dailyCfg){ CONFIG.mode=dailyCfg.mode; CONFIG.diff=dailyCfg.diff; CONFIG.lang=dailyCfg.lang; }
  G.daily=!!dailyCfg;
  G.mode=CONFIG.mode; G.diff=CONFIG.diff; G.lang=CONFIG.lang;
  const d=DIFFS.find(x=>x.id===CONFIG.diff)||DIFFS[1];

  // 词池解锁校验
  const sk=s.skills||{};
  if(CONFIG.diff==="hard"||CONFIG.diff==="night"){ if(!(sk.erudite>=1)&&CONFIG.diff==="hard"){} }
  if(CONFIG.lang==="mix"&&!(sk.polyglot>=1)) CONFIG.lang="cn";

  G.rng = dailyCfg ? mulberry32(dailyCfg.seed) : mulberry32((Date.now()^hashStr(String(Math.random())))|0);
  G.units=[]; G.idx=0; G.ci=0; G.gi=0; G.input="";
  G.combo=0; G.maxCombo=0; G.correct=0; G.wrong=0; G.score=0; G.words=0;
  G.perfect=true; G.wordScore=0; G.keyDelay={};

  const tough=+(s.skills&&s.skills.tough||0);
  G.maxLives = d.life + tough;
  G.lives = G.maxLives;
  G.shields = (s.skills&&s.skills.shield)||0;

  G.startTs=Date.now(); G.elapsed=0;
  G.limit = G.mode==="sprint"?60 : G.mode==="combo"?90 : G.mode==="climb"?0 : 0;
  G.threat=0; G.threatRate=0; G.stage=0; G.stageDone=0; G.stageNeed=8;
  if(G.mode==="climb") G.stageNeed=6;
  if(G.mode==="survival") G.threatRate = 3.2 - (s.skills&&s.skills.meteor||0)*0.29;

  fillUnits(12);
  G.on=true;
  showView("Play");
  renderFlow();
  updateHud();
  $("#hintLine").innerHTML = G.lang==="en"
    ? `<span>直接敲击屏幕上的字母</span><span><kbd>Esc</kbd> 退出</span>`
    : `<span>敲击拼音字母（如 <kbd>ni</kbd> <kbd>hao</kbd>）</span><span><kbd>Esc</kbd> 退出</span>`;
  G.timer=setInterval(tick,100);
}

/* -------------------------------------------------------------- 游戏循环 */
function tick(){
  if(!G.on) return;
  G.elapsed=(Date.now()-G.startTs)/1000;
  if(G.mode==="sprint"||G.mode==="combo"){
    const left=Math.max(0,Math.ceil(G.limit-G.elapsed));
    $("#mTime").textContent=left;
    $("#kTime").textContent="剩余秒";
    if(G.elapsed>=G.limit){ endGame(); return; }
  } else if(G.mode==="survival"){
    G.threat += G.threatRate/10;
    $("#mTime").textContent=Math.round(G.elapsed)+"s";
    $("#kTime").textContent="存活";
    if(G.threat>=100){ endGame(); return; }
    // 难度随时间攀升：每 25 秒提高一档词库
    const up=Math.floor(G.elapsed/25);
    if(up>0 && CONFIG.diff!=="night"){
      const order=["easy","normal","hard","night"];
      const idx=Math.min(order.indexOf(CONFIG.diff)+up,3);
      if(order[idx]!==CONFIG.diff){ CONFIG.diff=order[idx]; G.diff=CONFIG.diff; }
    }
  } else if(G.mode==="climb"){
    $("#mTime").textContent="第 "+(G.stage+1)+" 关";
    $("#kTime").textContent="进度";
  } else {
    $("#mTime").textContent=Math.round(G.elapsed)+"s";
    $("#kTime").textContent="用时";
  }
  updateHud();
}

/* -------------------------------------------------------------- 输入处理 */
window.addEventListener("keydown",e=>{
  if(G.on){
    if(e.key==="Escape"){ e.preventDefault(); quitGame(); return; }
    if(e.ctrlKey||e.metaKey||e.altKey) return;
    if(e.key.length!==1) return;
    e.preventDefault();
    handleKey(e.key);
    return;
  }
  if(CUR_VIEW==="Home"){
    if(e.key==="Enter"){ startGame(); }
  } else if(CUR_VIEW==="Result"){
    if(e.key==="r"||e.key==="R"){ startGame(); }
    if(e.key==="Escape"){ showView("Home"); }
  }
});
function handleKey(ch){
  if(!G.on) return;
  const now=Date.now();
  if(G.lastKeyTs){ G.keyDelay[ch]=(G.keyDelay[ch]||0)*0.88+((now-G.lastKeyTs))*0.12; }
  G.lastKeyTs=now;

  // 专注技能：失误后 1 秒免疫
  const focusOn=(S().skills&&S().skills.focus)||0;
  if(focusOn>0 && now<G.immuneUntil) return;

  const u=G.units[G.idx];
  if(!u) return;
  const expected=u.input[G.ci];
  if(ch===expected){
    G.correct++; G.combo++;
    if(u.lang==="cn") G.cnChars++; else G.enChars++;
    if(G.combo>G.maxCombo) G.maxCombo=G.combo;
    G.ci++;
    u.typed=u.typed+ch; G.input+=ch;
    // 音节完成推进
    let acc=0, gi=0;
    for(let i=0;i<u.syl.length;i++){ if(acc+u.syl[i].length>G.ci){ gi=i; break; } acc+=u.syl[i].length; }
    G.gi=gi;
    Audio2.key(G.combo);
    if(G.combo>0 && G.combo%25===0){ Audio2.milestone(); floatTxt(G.combo+" 连击!",$("#playArea")); spawnFlame(); }
    updateFlow();
    if(G.ci>=u.input.length){ completeWord(); }
  } else {
    onMistake(ch);
  }
}
function onMistake(ch){
  const s=S(), sk=s.skills||{};
  // 护盾：免除失误
  if(G.shields>0){ G.shields--; toast("🛡️ 护盾挡下一次失误"); Audio2.err(); return; }
  G.wrong++; G.perfect=false;
  // 连击结算：心境(zen) → 连击减半；稳键(steady) → 按等级保留一部分历史最高连击
  const zen=sk.zen||0, steady=sk.steady||0;
  if(zen>=1) G.combo=Math.floor(G.combo/2);
  else G.combo=0;
  if(steady>0) G.combo=Math.max(G.combo, Math.floor(G.maxCombo*steady*0.25));
  if(focusOn()) G.immuneUntil=Date.now()+1000;
  Audio2.err();
  const area=$("#playArea");
  area.classList.remove("shake"); void area.offsetWidth; area.classList.add("shake");
  const edge=$("#dangerEdge"); edge.classList.remove("hit"); void edge.offsetWidth; edge.classList.add("hit");
  $("#comboWrap").style.opacity="0.35";
  setTimeout(()=>$("#comboWrap").style.opacity="1",260);
  if(G.mode==="precision"){
    // 精准模式：整词重来
    const u=G.units[G.idx];
    G.ci=0; G.input=""; u.typed=""; G.gi=0;
    G.score=Math.floor(G.score*0.9);
    updateFlow();
    return;
  }
  if(G.mode==="survival"||G.mode==="climb"){
    G.lives--;
    if(G.lives<=0){ endGame(); return; }
    const u=G.units[G.idx];
    G.ci=0; G.input=""; u.typed=""; G.gi=0;
    updateFlow(); updateHud();
    return;
  }
  updateFlow();
}
function focusOn(){ return (S().skills&&S().skills.focus)||0; }

function completeWord(){
  const u=G.units[G.idx];
  const sk=S().skills||{};
  const d=DIFFS.find(x=>x.id===G.diff)||DIFFS[1];
  let mult=1+Math.min(G.combo,60)*0.02;
  if(G.combo>30) mult += (sk.master||0)*0.1;
  const gain=Math.round(10*d.mult*mult*(1+((sk.gale||0)*0.06)));
  G.score+=gain;
  G.words++;
  G.wordScore+=gain;
  Audio2.word(G.combo);
  spawnParticle(u);
  if(G.wordScore>=100){
    floatTxt("+"+G.wordScore,u); G.wordScore=0;
  }
  G.idx++; G.ci=0; G.input=""; G.gi=0;
  if(G.mode==="climb"){
    G.stageDone++;
    if(G.stageDone>=G.stageNeed){
      G.stageDone=0; G.stage++;
      if(G.stage>=10){ S().flags.peak=true; endGame(); return; }
      G.stageNeed=6+G.stage*2;
      const order=["easy","normal","hard","night"];
      CONFIG.diff=order[Math.min(Math.floor(G.stage/3),3)]; G.diff=CONFIG.diff;
      toast("🏔️ 抵达第 "+(G.stage+1)+" 关！");
    }
  }
  nextUnit();
  renderFlow();
  updateHud();
}

function renderFlow(){
  const flow=$("#flow");
  flow.innerHTML="";
  const start=Math.max(0,G.idx-1);
  const end=Math.min(G.units.length,G.idx+4);
  for(let i=start;i<end;i++){
    const u=G.units[i];
    const el=document.createElement("div");
    el.className="unit"+(i===G.idx?" cur":(i<G.idx?" past":""));
    if(u.lang==="cn"){
      const cn=document.createElement("div"); cn.className="cn-row";
      let acc=0;
      for(let k=0;k<u.syl.length;k++){
        const ch=u.text[k]||"";
        const c=document.createElement("span");
        c.className="cn-char"; c.textContent=ch;
        cn.appendChild(c);
        acc+=u.syl[k].length;
      }
      el.appendChild(cn);
      if(STORE.settings.showPinyin){
        const py=document.createElement("div"); py.className="py-row";
        for(let k=0;k<u.syl.length;k++){
          const s=document.createElement("div"); s.className="py-syl";
          for(const ch of u.syl[k]){
            const b=document.createElement("b"); b.textContent=ch; s.appendChild(b);
          }
          py.appendChild(s);
        }
        el.appendChild(py);
      }
    } else {
      const en=document.createElement("div"); en.className="en-row";
      for(const ch of u.input){
        const b=document.createElement("b"); b.textContent=ch; en.appendChild(b);
      }
      el.appendChild(en);
    }
    flow.appendChild(el);
  }
  // 位置：当前单元滚动到 .flow 顶部基准线（.flow 自身已锚定在容器 38% 高度处）
  const curEl=flow.querySelector(".unit.cur");
  if(curEl){
    const off=curEl.offsetTop;
    flow.style.transform=`translateY(${-off}px)`;
  }
  markTyped();
  updateHints();
}
function markTyped(){
  const cur=$("#flow .unit.cur"); if(!cur) return;
  const u=G.units[G.idx]; if(!u) return;
  if(u.lang==="cn"){
    const pys=cur.querySelectorAll(".py-syl");
    let acc=0;
    pys.forEach((p,k)=>{
      [...p.children].forEach((b,j)=>{
        const idx=acc+j;
        b.className = idx<G.ci ? "c" : (idx===G.ci ? "cur" : "");
      });
      acc+=u.syl[k].length;
    });
    const chars=cur.querySelectorAll(".cn-char");
    let a2=0;
    chars.forEach((c,k)=>{
      const len=u.syl[k].length;
      c.classList.toggle("g", a2+len<=G.ci);
      c.classList.toggle("hit", a2<=G.ci && G.ci<a2+len);
      a2+=len;
    });
  } else {
    const bs=cur.querySelectorAll("b");
    bs.forEach((b,i)=>b.className = i<G.ci?"c":(i===G.ci?"cur":""));
  }
}
function updateFlow(){ markTyped(); }

/* -------------------------------------------------------------- 结算 */
function endGame(){
  if(!G.on) return;
  G.on=false;
  clearInterval(G.timer);
  Audio2.finish();
  const mins=Math.max(G.elapsed/60,1/600);
  const wpm=Math.round((G.correct/5)/mins);
  const acc=G.correct+G.wrong>0?Math.round(G.correct/(G.correct+G.wrong)*100):100;
  const s=S();
  const isCN=G.lang==="cn";
  const finalScore=Math.round(G.score*(0.6+acc/100*0.6)*(G.mode==="precision"?(G.perfect?1.5:1):1));
  const xp=Math.round(finalScore/10+G.correct/4);
  const coins=Math.round(finalScore/60+G.maxCombo*0.6);
  const newRec=[];
  if(wpm>s.stats.bestWpm){ s.stats.bestWpm=wpm; newRec.push("速度"); }
  if(G.maxCombo>s.stats.bestCombo){ s.stats.bestCombo=G.maxCombo; newRec.push("连击"); }
  if(finalScore>s.stats.bestScore){ s.stats.bestScore=finalScore; newRec.push("得分"); }
  s.stats.games++; s.stats.chars+=G.correct; s.stats.words+=G.words; s.stats.time+=G.elapsed;
  s.stats.accSum+=acc; s.stats.accN++;
  s.stats.byMode[G.mode]=(s.stats.byMode[G.mode]||0)+1;
  s.stats.byLang[G.lang]=(s.stats.byLang[G.lang]||0)+G.correct;
  s.stats.byLang.cn=(s.stats.byLang.cn||0)+G.cnChars;
  s.stats.byLang.en=(s.stats.byLang.en||0)+G.enChars;
  for(const k in G.keyDelay){ s.stats.keys[k]=s.stats.keys[k]||{n:0,s:0}; s.stats.keys[k].n++; s.stats.keys[k].s+=G.keyDelay[k]; }
  if(G.mode==="precision"&&G.perfect) s.flags.perfect=true;
  if(G.mode==="climb"&&G.stage>=10) s.flags.peak=true;
  if(G.mode==="survival"&&G.elapsed>=120) s.flags.survive120=true;
  if(G.daily){ s.flags.dailyDone=true; STORE.daily.done=true; STORE.daily.best=Math.max(STORE.daily.best,finalScore); }
  s.history.push({ wpm, acc, combo:G.maxCombo, score:finalScore, mode:G.mode, ts:Date.now() });
  if(s.history.length>60) s.history=s.history.slice(-60);
  // 升级
  const before=s.lvl;
  s.xp+=xp; s.coins+=coins;
  while(s.xp>=lvlNeed(s.lvl)){ s.xp-=lvlNeed(s.lvl); s.lvl++; s.sp++; }
  // 成就
  const unlocked=[];
  for(const a of ACHIEVEMENTS){
    if(!s.ach[a.id] && a.chk(s)){ s.ach[a.id]=Date.now(); unlocked.push(a); }
  }
  saveStore();
  renderResult({wpm,acc,finalScore,xp,coins,newRec,unlocked,levelUp:s.lvl>before});
  showView("Result");
}
function quitGame(){ if(!G.on) return; G.on=false; clearInterval(G.timer); showView("Home"); renderHome(); }

/* ------------------------------------------------------------ 统计 */
function renderStats(){
  const s=S();
  const st=s.stats;
  $("#kpiWrap").innerHTML=`
    <div class="kpi"><div class="v">${st.bestWpm}</div><div class="k">最高速度</div></div>
    <div class="kpi"><div class="v">${st.bestCombo}</div><div class="k">最高连击</div></div>
    <div class="kpi"><div class="v">${fmt(st.chars)}</div><div class="k">累计字符</div></div>
    <div class="kpi"><div class="v">${fmt(st.words)}</div><div class="k">累计词数</div></div>
    <div class="kpi"><div class="v">${st.accN?Math.round(st.accSum/st.accN):100}%</div><div class="k">平均准确率</div></div>
    <div class="kpi"><div class="v">${st.games}</div><div class="k">总局数</div></div>
    <div class="kpi"><div class="v">${Math.round(st.time/60)}</div><div class="k">累计分钟</div></div>
    <div class="kpi"><div class="v">${rankOf(st.bestWpm).nm}</div><div class="k">当前段位</div></div>`;
  // 折线图
  const cv=$("#chartWpm"); const ctx=cv.getContext("2d");
  const dpr=window.devicePixelRatio||1;
  const W=cv.clientWidth||320, H=180;
  cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  const hist=s.history.slice(-12);
  if(hist.length<1){ ctx.fillStyle="#8fa0c8"; ctx.font="13px sans-serif"; ctx.fillText("暂无数据，先来一局吧",16,H/2); }
  else{
    const vals=hist.map(h=>h.wpm);
    const mx=Math.max(10,...vals)*1.15, mn=0;
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,"rgba(56,225,196,.30)"); g.addColorStop(1,"rgba(56,225,196,0)");
    const X=i=>14+(i*(W-28))/Math.max(1,hist.length-1);
    const Y=v=>H-24-((v-mn)/(mx-mn))*(H-40);
    ctx.beginPath(); ctx.moveTo(X(0),Y(vals[0]));
    for(let i=1;i<vals.length;i++) ctx.lineTo(X(i),Y(vals[i]));
    ctx.lineTo(X(vals.length-1),H-24); ctx.lineTo(X(0),H-24); ctx.closePath();
    ctx.fillStyle=g; ctx.fill();
    ctx.beginPath(); ctx.moveTo(X(0),Y(vals[0]));
    for(let i=1;i<vals.length;i++) ctx.lineTo(X(i),Y(vals[i]));
    ctx.strokeStyle="#38e1c4"; ctx.lineWidth=2.4; ctx.lineJoin="round"; ctx.stroke();
    vals.forEach((v,i)=>{
      ctx.beginPath(); ctx.arc(X(i),Y(v),3.6,0,7);
      ctx.fillStyle="#0b1020"; ctx.fill();
      ctx.strokeStyle="#38e1c4"; ctx.lineWidth=2; ctx.stroke();
    });
    ctx.fillStyle="#61729b"; ctx.font="11px sans-serif";
    ctx.fillText("0",14,H-8);
    ctx.fillText(String(Math.round(mx)),W-34,H-8);
  }
  // 弱键
  const keys=Object.entries(st.keys||{}).filter(([,v])=>v.n>=8)
    .map(([k,v])=>({k,avg:v.s/v.n,n:v.n}))
    .sort((a,b)=>b.avg-a.avg).slice(0,8);
  const wl=$("#weakList");
  if(!keys.length){ wl.innerHTML='<div style="font-size:12px;color:var(--dim2)">数据不足，多打几局后这里会列出你的"拖沓键"</div>'; }
  else{
    const mx=Math.max(...keys.map(k=>k.avg));
    wl.innerHTML=keys.map(k=>`<div class="weak"><span class="k">${esc(k.k.toUpperCase())}</span>
      <span class="bar"><i style="width:${Math.round(k.avg/mx*100)}%"></i></span>
      <span class="ms">${k.avg.toFixed(0)}ms</span></div>`).join("");
  }
}

/* ------------------------------------------------------------ 主题 */
function applyTheme(){
  const t=STORE.settings.theme||"dark";
  document.documentElement.setAttribute("data-theme",t);
  const sk=SKINS.find(x=>x.id===S().skin)||SKINS[0];
  document.documentElement.style.setProperty("--acc",sk.c1);
  document.documentElement.style.setProperty("--acc2",sk.c2);
  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta) meta.content=t==="dark"?"#0b1020":"#eef2fb";
}

/* ------------------------------------------------------------ 设置弹窗 */
function openSettings(){
  const s=STORE.settings;
  const body=document.createElement("div");
  body.className="mask";
  body.innerHTML=`<div class="modal">
    <h3>⚙️ 设置</h3>
    <div class="set-row"><div><div class="t">音效</div><div class="d">按键与连击提示音</div></div>
      <button class="switch ${s.sound?"on":""}" data-k="sound"><i></i></button></div>
    <div class="set-row"><div><div class="t">粒子特效</div><div class="d">完成单词时的迸发动画</div></div>
      <button class="switch ${s.particles?"on":""}" data-k="particles"><i></i></button></div>
    <div class="set-row"><div><div class="t">显示拼音</div><div class="d">关闭后需凭汉字读音自行拼写</div></div>
      <button class="switch ${s.showPinyin?"on":""}" data-k="showPinyin"><i></i></button></div>
    <div class="set-row"><div><div class="t">音色</div><div class="d">正弦 / 三角 / 方波</div></div>
      <div class="seg" id="segTone">
        <button data-v="sine" class="${s.tone==="sine"?"on":""}">清脆</button>
        <button data-v="triangle" class="${s.tone==="triangle"?"on":""}">柔和</button>
        <button data-v="square" class="${s.tone==="square"?"on":""}">机械</button>
      </div></div>
    <div class="set-row" style="display:block">
      <div style="margin-bottom:10px"><div class="t">皮肤</div><div class="d">用星尘解锁不同配色</div></div>
      <div class="skins" id="skinWrap"></div>
    </div>
    <div style="display:flex;gap:10px;margin-top:18px">
      <button class="btn" id="btnExport" style="flex:1">📤 导出存档</button>
      <button class="btn" id="btnImport" style="flex:1">📥 导入存档</button>
    </div>
    <div style="display:flex;gap:10px;margin-top:10px">
      <button class="btn" id="btnReset" style="flex:1;color:var(--bad)">🗑️ 重置当前存档</button>
    </div>
    <div style="margin-top:16px;text-align:right"><button class="btn pri" id="btnCloseSet">完成</button></div>
  </div>`;
  $("#modalRoot").appendChild(body);
  body.querySelectorAll(".switch").forEach(btn=>{
    btn.onclick=()=>{ const k=btn.dataset.k; s[k]=!s[k]; btn.classList.toggle("on",s[k]); saveStore(); };
  });
  body.querySelectorAll("#segTone button").forEach(b=>{
    b.onclick=()=>{ s.tone=b.dataset.v; body.querySelectorAll("#segTone button").forEach(x=>x.classList.toggle("on",x===b)); saveStore(); };
  });
  const sw=body.querySelector("#skinWrap");
  const owned=S().skins||["storm"];
  for(const sk of SKINS){
    const el=document.createElement("button");
    const has=owned.includes(sk.id);
    el.className="skin"+(S().skin===sk.id?" on":"");
    el.innerHTML=`<div class="sw" style="background:linear-gradient(135deg,${sk.c1},${sk.c2})"></div>
      <div class="nm">${sk.name}</div>
      <div class="${has?"own":"pr"}">${has?(S().skin===sk.id?"使用中":"已拥有"):"✦ "+sk.price}</div>`;
    el.onclick=()=>{
      if(has){ S().skin=sk.id; saveStore(); applyTheme(); renderHome(); openSettingsClose(body); openSettings(); }
      else{
        if(S().coins<sk.price){ toast("星尘不足，还差 "+(sk.price-S().coins)); return; }
        S().coins-=sk.price; S().skins=owned.concat([sk.id]); S().skin=sk.id;
        saveStore(); applyTheme(); renderHome(); toast("🎨 已解锁皮肤「"+sk.name+"」");
        openSettingsClose(body); openSettings();
      }
    };
    sw.appendChild(el);
  }
  body.querySelector("#btnCloseSet").onclick=()=>body.remove();
  body.onclick=e=>{ if(e.target===body) body.remove(); };
  body.querySelector("#btnExport").onclick=()=>{
    const blob=new Blob([JSON.stringify(STORE,null,2)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="typing-storm-"+todayKey()+".json";
    a.click(); URL.revokeObjectURL(a.href);
    toast("存档已导出");
  };
  body.querySelector("#btnImport").onclick=()=>{
    const inp=document.createElement("input"); inp.type="file"; inp.accept=".json,application/json";
    inp.onchange=()=>{
      const f=inp.files[0]; if(!f) return;
      const rd=new FileReader();
      rd.onload=()=>{
        try{
          const d=JSON.parse(rd.result);
          if(!d||!Array.isArray(d.slots)) throw new Error("bad");
          STORE=d; saveStore(); applyTheme(); renderHome(); body.remove(); toast("存档导入成功");
        }catch(e){ toast("导入失败：文件格式不正确"); }
      };
      rd.readAsText(f);
    };
    inp.click();
  };
  body.querySelector("#btnReset").onclick=()=>{
    if(!confirm("确定重置「"+S().name+"」？此操作不可撤销。")) return;
    const i=STORE.active;
    STORE.slots[i]=newSlotData(STORE.slots[i].name);
    saveStore(); applyTheme(); renderHome(); body.remove(); toast("已重置");
  };
}
function openSettingsClose(body){ if(body&&body.parentNode) body.remove(); }

/* ------------------------------------------------------------ 存档菜单 */
function openSaveMenu(){
  const body=document.createElement("div");
  body.className="mask";
  body.innerHTML=`<div class="modal"><h3>💾 存档管理</h3>
    <div id="slotWrap"></div>
    <div style="margin-top:16px;text-align:right"><button class="btn pri" id="btnCloseSave">关闭</button></div></div>`;
  $("#modalRoot").appendChild(body);
  const sw=body.querySelector("#slotWrap");
  STORE.slots.forEach((sl,i)=>{
    const el=document.createElement("div");
    el.className="skill"; el.style.marginBottom="8px";
    el.innerHTML=`<div class="ic">${i===STORE.active?"✅":"💾"}</div>
      <div class="tx"><div class="nm">${esc(sl.name)}<span class="lv">Lv.${sl.lvl}</span></div>
      <div class="ds">⚡${sl.stats.bestWpm} · 火${sl.stats.bestCombo} · ${sl.stats.games} 局 · ✦${sl.coins}</div></div>`;
    const btns=document.createElement("div"); btns.style.display="flex"; btns.style.gap="6px";
    if(i!==STORE.active){
      const b=document.createElement("button"); b.className="btn sm"; b.textContent="切换";
      b.onclick=()=>{ STORE.active=i; saveStore(); applyTheme(); renderHome(); body.remove(); toast("已切换到 "+sl.name); };
      btns.appendChild(b);
    }
    const rn=document.createElement("button"); rn.className="btn sm"; rn.textContent="重命名";
    rn.onclick=()=>{
      const nm=prompt("存档名称",sl.name);
      if(nm!==null&&nm.trim()){ sl.name=nm.trim().slice(0,16); saveStore(); body.remove(); openSaveMenu(); }
    };
    btns.appendChild(rn);
    const cp=document.createElement("button"); cp.className="btn sm"; cp.textContent="复制";
    cp.onclick=()=>{
      const ni=STORE.slots.findIndex((x,j)=>j!==i&&x.name===sl.name+" 副本");
      const idx=ni>=0?ni:(STORE.slots.length<6?STORE.slots.length:1);
      if(STORE.slots.length>=6){ toast("最多 6 个存档"); return; }
      STORE.slots.push(Object.assign({},JSON.parse(JSON.stringify(sl)),{name:sl.name+" 副本"}));
      saveStore(); body.remove(); openSaveMenu(); toast("已复制存档");
    };
    btns.appendChild(cp);
    el.appendChild(btns);
    sw.appendChild(el);
  });
  body.querySelector("#btnCloseSave").onclick=()=>body.remove();
  body.onclick=e=>{ if(e.target===body) body.remove(); };
}

/* ------------------------------------------------------------ 事件绑定 */
function bind(){
  $("#btnStart").onclick=()=>startGame();
  $("#btnDaily").onclick=()=>startGame(STORE.daily.cfg);
  $("#btnDaily2").onclick=()=>startGame(STORE.daily.cfg);
  $("#btnQuit").onclick=()=>quitGame();
  $("#btnSet").onclick=()=>openSettings();
  $("#btnSave").onclick=()=>openSaveMenu();
  $$("#tabbar button[data-v]").forEach(b=>b.onclick=()=>showView(b.dataset.v));
  $("#playArea").addEventListener("click",()=>{ if(G.on) Audio2.init(); });
  window.addEventListener("resize",()=>{ if(G.on) renderFlow(); });
  document.addEventListener("pointerdown",()=>Audio2.init(),{once:true});
}
function applySettingsToDOM(){
  document.documentElement.setAttribute("data-theme",STORE.settings.theme||"dark");
}
window.startGame = startGame;
window.showView = showView;
window.renderHome = renderHome;
window.renderTree = renderTree;

/* ------------------------------------------------------------ 启动 */
function boot(){
  applySettingsToDOM();
  applyTheme();
  bind();
  renderHome();
  // 每日挑战状态刷新
  if(STORE.daily.date!==todayKey()){ STORE.daily.date=todayKey(); STORE.daily.done=false; STORE.daily.best=0; }
  saveStore();
}
boot();
</script>
</body>
</html>
